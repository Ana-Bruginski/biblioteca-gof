# Perfil de execucao: PRODUCAO (MySQL) ou TESTE (memoria).
# Pode ser trocado na linha de comando com -Dperfil=TESTE
perfil=PRODUCAO

# MySQL principal (Oracle e replica e nao recebe escritas da aplicacao)
mysql.url=jdbc:mysql://localhost:3306/biblioteca_ib2b?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
mysql.usuario=root
mysql.senha=root

# Banco que atende a instalacao: A ou B (Adapter)
banco=A

# Politica de multa inicial: ORIGINAL, TETO ou TOLERANCIA (Strategy)
multa.politica=ORIGINAL

# Recursos opcionais da consulta ao acervo (Decorator)
consulta.medicao=true
consulta.cache=true
consulta.cache.ttlSegundos=300
